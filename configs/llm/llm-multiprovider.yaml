# configs/llm/llm-multiprovider.yaml
binds:
- port: 3000
  listeners:
  - name: default
    protocol: HTTP
    routes:
    - name: llm-multiprovider-route
      match:
        pathPrefix: "/v1/chat/completions"
      backends:
      - ai:
          groups:
          - providers:
            - name: openai
              provider:
                openAI:
                  model: gpt-3.5-turbo
              backendAuth:
                key: "$OPENAI_API_KEY"
            - name: anthropic
              provider:
                anthropic:
                  model: claude-3-haiku-20240307
              backendAuth:
                key: "$ANTHROPIC_API_KEY"
        policies:
          localRateLimit:
            - maxTokens: 10000
              tokensPerFill: 10000
              fillInterval: 1h
              type: tokens
          llmSpendControl:
            monthlyBudgetUsd: "${LLM_MONTHLY_BUDGET_USD:-50}"
            perRequestMaxUsd: "${LLM_MAX_PER_REQ_USD:-0.50}"
